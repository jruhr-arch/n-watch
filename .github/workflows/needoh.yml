name: NeeDoh watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check stock
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MAX_PRICE: "30"
        run: python needoh_watch.py
      - name: Save state
        run: |
          git config user.name "needoh-bot"
          git config user.email "needoh-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "state update"
          git pull --rebase --autostash || true
          git push || true
